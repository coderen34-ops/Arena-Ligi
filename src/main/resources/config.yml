# ================================================================
#  ARENA LİGİ
#  Para işlemleri MeslekSistemi bankası/kasası üzerinden yapılır (MeslekAPI).
# ================================================================

# Ligler eşik puanına göre sıralanır (renk: & kodları)
ligler:
  - {ad: 'Çaylak', esik: 0, renk: '&7'}
  - {ad: 'Savaşçı', esik: 150, renk: '&a'}
  - {ad: 'Usta', esik: 400, renk: '&b'}
  - {ad: 'Efsane', esik: 800, renk: '&6'}

puan:
  galibiyet: 25
  maglubiyet: 20
  lig-farki-carpani: 0.25   # Her lig farkı için +/-%25 (üst ligi yenen daha çok kazanır, üst lige yenilen daha az kaybeder)
  dusme-payi: 30            # Puan lig eşiğinin bu kadar altına inince bir alt lige düşülür

lakap:
  min: 3
  max: 24

# Maç akışı
mac:
  aralik-dakika: 10          # Otomatik eşleştirme bu aralıkla yapılır (sırada en az 2 uygun dövüşçü varsa)
  onay-saniye: 30            # "Maça hazır mısın?" onay süresi
  giris-ucreti: 500          # Bankadan alınır
  kazanan-payi: 0.8          # Giriş ücretleri toplamının kazanana giden oranı; kalanı belediye kasasına
  bahis-suresi-saniye: 90    # Maç öncesi bekleme salonunda geçen süre (bahis penceresi)
  geri-sayim-saniye: 5
  sure-dakika: 3             # Süre dolarsa daha çok hasar veren kazanır, eşitse berabere (ücretler iade)
  terk-saniye: 60            # Maçtan çıkan bu sürede dönmezse yenilmiş sayılır
  komsu-lig-eslesme: true    # Aynı ligde rakip yoksa bir alt/üst ligle eşleşebilir
  anons-herkese: false       # Arenaya giriş anonsu (ekran ortası) herkese mi, sadece arena/tribündekilere mi
  yasak-komutlar: [tpa, tpahere, tpaccept, tpyes, home, homes, sethome, spawn, warp, warps, back, rtp, wild, tp, call, kit, ec, enderchest, hat, gamemode, gm, fly, heal, feed]

# Hazır kitler: her maçta biri rastgele seçilir, iki dövüşçüye de aynısı verilir.
#   zirh: LEATHER | CHAINMAIL | IRON | GOLDEN | DIAMOND | NETHERITE (kask, göğüslük, pantolon, bot)
#   zirh-buyu: zırhın her parçasına (örn. "protection:1,unbreaking:1")
#   esyalar: "MALZEME [adet] [buyu:seviye,...]" (sırayla hotbar'a), offhand: kalkan vb.
#   Oyun içinden /arena admin kit ekle <ad> ile eklenen kitler de havuza girer.
hazir-kitler:
  demir-mizrak:
    zirh: IRON
    esyalar: [IRON_SPEAR, IRON_SWORD, 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
    offhand: SHIELD
  elmas-kilic-kalkan:
    zirh: DIAMOND
    esyalar: [DIAMOND_SWORD, 'COOKED_BEEF 8', 'GOLDEN_APPLE 2']
    offhand: SHIELD
  elmas-balta:
    zirh: DIAMOND
    esyalar: [DIAMOND_AXE, 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
    offhand: SHIELD
  elmas-mizrak:
    zirh: DIAMOND
    esyalar: [DIAMOND_SPEAR, DIAMOND_SWORD, 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
  okcu:
    zirh: CHAINMAIL
    zirh-buyu: 'projectile_protection:1'
    esyalar: ['BOW 1 power:2', IRON_SWORD, 'ARROW 32', 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
  arbaletci:
    zirh: IRON
    esyalar: ['CROSSBOW 1 quick_charge:1', STONE_AXE, 'ARROW 24', 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
    offhand: SHIELD
  topuzcu:
    zirh: IRON
    esyalar: [MACE, IRON_SWORD, 'WIND_CHARGE 8', 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
    offhand: SHIELD
  netherit-kilic:
    zirh: NETHERITE
    esyalar: [NETHERITE_SWORD, 'COOKED_BEEF 8', 'GOLDEN_APPLE 1']
    offhand: SHIELD

yasakli-kelimeler:
  - amk
  - orospu
  - siktir
  - yarrak
  - ibne
  - pezevenk
  - gavat
  - discord
  - http
  - www

